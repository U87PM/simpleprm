<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Person</title>
</head>
<body>
    <h2 data-i18n="addHtmlTitle">Add Person</h2>
    
    <fieldset>
        <label data-i18n="firstName">First mame</label><br>
        <input type="text" id="firstName"><br>
        <label data-i18n="lastName">Last name</label><br>
        <input type="text" id="lastName"><br>
        <label data-i18n="email"="">Email</label><br>
        <input type="email" id="email"><br>
        <label data-i18n="phone">Phone</label><br>
        <input type="tel" id="phone"><br>
        <label data-i18n="birthday">Birthday</label><br>
        <input type="date" id="birthday"><br>


        <button data-i18n="add" onclick="addPerson()">Add</button>
    </fieldset>

    <script>
        function addPerson() {
            fetch("/api/people", {
                method: "POST",
                headers: { "Content-Type": "application/json"},
                body: JSON.stringify({
                    firstName: document.getElementById("firstName").value,
                    lastName: document.getElementById("lastName").value,
                    email: document.getElementById("email").value,
                    phone: document.getElementById("phone").value,
                    birthday: document.getElementById("birthday").value
                })
            });
        }
    </script>
    <script src="i18n.js"></script>
</body>
</html>
