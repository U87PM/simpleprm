<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Person</title>
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 420px; 
            margin-top: 40px;
            margin-left: 40px;
        }
        .page-header h2 {
            margin: 0 0 4px 0;
        }

        fieldset {
            margin-bottom: 24px;
            
        }
        label {
            /* display: block; */
            margin-top: 8px;
        }
        input, select { 
            width: 100%;
            padding: 6px;
            margin-top: 2px;
            box-sizing: border-box;
        }
        button { 
            margin-top: 12px; 
            padding: 8px 16px; 
        }
    
        .autocomplete-wrapper { position: relative; }

    </style>
</head>
<body>
    <div class="page-header">
        <h2 data-i18n="addHtmlTitle"></h2>
        <a data-i18n="graphPageLink" href="./graph.html"></a>
    </div>
    <div>
        <fieldset>
            <label data-i18n="firstName"></label>
            <input type="text" id="firstName" autocomplete="given-name">
            <label data-i18n="lastName"></label>
            <input type="text" id="lastName" autocomplete="family-name">
            <label data-i18n="email"></label>
            <input type="email" id="email" autocomplete="email">
            <label data-i18n="phone"></label>
            <input type="tel" id="phone" autocomplete="tel">
            <label data-i18n="birthday"></label>
            <input type="date" id="birthday" autocomplete="bday">

        </fieldset>

        <fieldset>
            <label data-i18n="person"></label>
            <div class="autocomplete-wrapper">
                <input id="relPersonInput" autocomplete="off">
                <ul id="relSuggestions" class="suggestions" style="display:block"></ul>
            </div>
            <label data-i18n="relationshipType"></label>
            <select id="relType">
                <option value="friend">Friend</option>
                <option value="family">Family</option>
                <option value="colleague">Colleague</option>
            </select>
            <button data-i18n="add" type="button" onclick="addPendingRelationship()"></button>
        
            <ul id="pendingList" class="pending-list"></ul>
        </fieldset>

        <button data-i18n="add" onclick="addPerson()"></button>
    </div>

    <script src="/js/add.js"></script>
    <script src="/js/i18n.js"></script>
</body>
</html>
